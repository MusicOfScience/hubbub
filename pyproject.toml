[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "margin-of-error"
version = "0.1.0"
description = "Australian election prediction and live-count analysis"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "streamlit>=1.32.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "plotly>=5.18.0",
    "folium>=0.16.0",
    "streamlit-folium>=0.18.0",
    "openpyxl>=3.1.0",
    "scipy>=1.12.0",
    "python-dotenv>=1.0.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "xlsxwriter>=3.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=4.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "frontend*"]
